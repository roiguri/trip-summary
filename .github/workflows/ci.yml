# Checks every pull request and every push to main: formatting, types, a production build, the
# interaction checks (verification Part 13) and the visual regression tests against the sample trip.
# Run it by hand with "update baselines" to get baselines rendered on GitHub's machines as an
# artifact (tests/visual/baseline), if they ever differ from the committed ones for platform reasons.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Render new visual baselines and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Mock sources are up to date
        run: npm run mocks -- --check

      - name: Unit tests
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Store tests (Firebase emulators)
        run: npm run test:store

      - name: Build
        run: npm run build
        env:
          # Built for the emulators: the sign-in page talks to the Auth emulator.
          NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099

      # The app reads the store: from here on it runs against the emulators, holding the sample trip.
      - name: Start the emulators and seed the sample trip
        run: |
          node scripts/firebase.mjs emulators:start --only firestore,storage,auth > emulators.log 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8080 && curl -sf -o /dev/null http://127.0.0.1:9099 && break; sleep 1; done
          npm run seed
          npm run seed -- data/fixtures/test-trip.json
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199

      - name: Browser for the interaction checks
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199

      - name: Interaction checks
        run: BASE_URL=http://localhost:3100 npm run check:interactions

      - name: Visual regression tests
        if: ${{ !inputs.update_baselines }}
        run: BASE_URL=http://localhost:3100 npm run visual

      # Last: these create invites and trips, which the home page's cards show.
      - name: Sign-in and access checks
        if: ${{ !inputs.update_baselines }}
        run: BASE_URL=http://localhost:3100 npm run check:access

      - name: Adding a trip and importing
        if: ${{ !inputs.update_baselines }}
        run: BASE_URL=http://localhost:3100 npm run check:import

      - name: Photos
        if: ${{ !inputs.update_baselines }}
        run: BASE_URL=http://localhost:3100 npm run check:photos

      - name: Visual differences (baseline | now | diff)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: tests/visual/output
          if-no-files-found: ignore

      - name: Render new visual baselines
        if: ${{ inputs.update_baselines }}
        run: BASE_URL=http://localhost:3100 npm run visual:update

      - name: New visual baselines
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baseline

      - name: Server log
        if: failure()
        run: cat server.log || true
