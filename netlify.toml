# Netlify builds and serves the app with its Next.js support; nothing in the app is Netlify-specific
# (docs/ARCHITECTURE.md, "Rules that keep it portable"). Secrets are set in Netlify's site settings,
# never here.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.23.3"
  # The server functions run on their own Node; ask for 22. (firebase-admin's jwks-rsa is also pinned
  # to 3.x in package.json, so it never needs require() of an ES module, whatever the runtime.)
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
