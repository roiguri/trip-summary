# Netlify builds and serves the app with its Next.js support; nothing in the app is Netlify-specific
# (docs/ARCHITECTURE.md, "Rules that keep it portable"). Secrets are set in Netlify's site settings,
# never here.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.23.3"
  # The server functions run on their own Node, older by default; firebase-admin's jwks-rsa loads the
  # ES-module-only jose with require(), which needs Node 22.12+.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
